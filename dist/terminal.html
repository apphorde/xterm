<template component="x-terminal">
  <div class="flex flex-col w-full h-full p-2 bg-black">
    <div class="flex w-full items-center justify-between pb-2 font-mono text-sm text-white">
      <div class="flex min-w-0 items-center gap-2">
        <span class="h-2.5 w-2.5 shrink-0 rounded-full bg-yellow-400" bind-class="{ 'bg-green-400': online, 'bg-yellow-400': !online }" aria-label="Connection status"></span>
        <span class="truncate">{{ remote }}</span>
      </div>
      <div class="shrink-0 pl-3">
        <button class="rounded border border-red-900 bg-red-950 px-2 py-1 text-xs text-red-200 hover:bg-red-900" on-click="onClose()">
          Close
        </button>
      </div>
    </div>
    <div ref="terminal" class="w-full h-full overflow-hidden"></div>
  </div>

  <script setup src="/terminal.mjs"></script>
</template>
