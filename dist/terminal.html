<template component="app-terminal">
  <div class="flex flex-col w-full h-full p-2 bg-black">
    <div class="flex w-full items-center flex-1 pb-2 space-x-1 font-mono text-white text-sm">
      <div class="w-2/3">
        <span>{{ remote }}</span>
        <span>{{ key.slice(4, 12) }}...</span>
      </div>
      <div class="w-1/3">
        <button
          class="rounded-full w-3 h-3 flex-1"
          bind-class="{ 'bg-green-400': online, 'bg-yellow-400': !online }"
          on-click="onReconnect()"
        >
          &nbsp;
        </button>
        <button class="rounded-full w-3 h-3 bg-red-400 flex-1" on-click="onClose()">&nbsp;</button>
      </div>
    </div>
    <div ref="terminal" class="w-full h-full overflow-hidden"></div>
  </div>

  <script setup src="/terminal.mjs"></script>
</template>
